<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş · Yemekhane Otomasyonu</title>
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/uygulama.css">
</head>
<body class="giris-zemin">
  <main class="giris-kart">
    <h1><span class="marka-isaret" aria-hidden="true"></span>Yemekhane</h1>
    <p class="soluk">Kampüs yemekhanesi menü, rezervasyon ve bakiye işlemleri.</p>

    <p id="bildirim" class="bildirim" hidden></p>

    <form id="giris-formu" novalidate>
      <div class="alan">
        <label for="eposta">E-posta</label>
        <input id="eposta" name="eposta" type="email" autocomplete="username" required inputmode="email" placeholder="ad.soyad@kampus.edu.tr">
      </div>
      <div class="alan">
        <label for="sifre">Şifre</label>
        <input id="sifre" name="sifre" type="password" autocomplete="current-password" required>
      </div>
      <button class="dugme dugme-tam" type="submit">Giriş yap</button>
    </form>

    <details class="demo-hesaplar">
      <summary>Test hesapları (şifre: Yemek2026!)</summary>
      <ul>
        <li><button type="button" data-eposta="mehmet.yildiz@ogr.kampus.edu.tr">mehmet.yildiz@ogr… (öğrenci)</button></li>
        <li><button type="button" data-eposta="ayse.demir@ogr.kampus.edu.tr">ayse.demir@ogr… (öğrenci, düşük bakiye)</button></li>
        <li><button type="button" data-eposta="murat.kaya@kampus.edu.tr">murat.kaya@… (personel)</button></li>
        <li><button type="button" data-eposta="leyla.arslan@kampus.edu.tr">leyla.arslan@… (yönetici)</button></li>
      </ul>
    </details>
  </main>
  <script type="module" src="/js/giris.js"></script>
</body>
</html>
